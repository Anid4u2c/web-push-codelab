name: Validate and deploy Firebase push demo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix functions --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:rules

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix functions --no-audit --no-fund
      - run: npm run build
      - name: Check deployment credential
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const raw = process.env.FIREBASE_SERVICE_ACCOUNT;
          if (!raw) throw new Error('Configure the FIREBASE_SERVICE_ACCOUNT repository secret.');
          const key = JSON.parse(raw);
          if (key.type !== 'service_account' || key.project_id !== 'web-push-4u2c') {
            throw new Error('The deployment credential must belong to web-push-4u2c.');
          }
          fs.writeFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, raw, { mode: 0o600 });
          NODE
      - name: Prepare stable VAPID secret
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: node scripts/prepare-push.mjs
      - name: Deploy push backend before Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const result = spawnSync(process.execPath, [
            'node_modules/firebase-tools/lib/bin/firebase.js', 'deploy',
            '--only', 'functions:push', '--project', 'web-push-4u2c', '--non-interactive'
          ], { encoding: 'utf8' });
          process.stdout.write(result.stdout || '');
          process.stderr.write(result.stderr || '');
          if (result.status !== 0) {
            const output = `${result.stdout || ''}\n${result.stderr || ''}`.replace(/\x1b\[[0-9;]*m/g, '');
            const message = output.split('\n').map(line => line.trim()).find(line => line.includes('Error:'))
              || 'Function deployment failed. Inspect the Firebase CLI output.';
            console.log(`::error::${message.replaceAll('%', '%25').replaceAll('\r', '%0D')}`);
          }
          process.exit(result.status ?? 1);
          NODE
      - name: Deploy database rules before Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const result = spawnSync(process.execPath, [
            'node_modules/firebase-tools/lib/bin/firebase.js', 'deploy',
            '--only', 'database', '--project', 'web-push-4u2c', '--non-interactive'
          ], { encoding: 'utf8' });
          process.stdout.write(result.stdout || '');
          process.stderr.write(result.stderr || '');
          if (result.status !== 0) {
            const output = `${result.stdout || ''}\n${result.stderr || ''}`.replace(/\x1b\[[0-9;]*m/g, '');
            const message = output.split('\n').map(line => line.trim()).find(line => line.includes('Error:'))
              || 'Database rule deployment failed. Inspect the Firebase CLI output.';
            console.log(`::error::${message.replaceAll('%', '%25').replaceAll('\r', '%0D')}`);
          }
          process.exit(result.status ?? 1);
          NODE
      - name: Deploy Hosting only
        uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: web-push-4u2c
          channelId: live
      - name: Remove deployment credential
        if: always()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
